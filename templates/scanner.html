<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>ExpiryWise Scanner</title>


    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f7f6;
            color: #222;
        }

        header {
            background: linear-gradient(135deg, #1b5e20, #43a047);
            color: white;
            padding: 30px 20px;
            text-align: center;
        }

        header h1 {
            margin: 0;
            font-size: 32px;
        }

        .container {
            width: 92%;
            max-width: 650px;
            margin: 30px auto;
        }

        .box {
            background: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 3px 15px rgba(0,0,0,0.1);
            margin-bottom: 20px;
        }

        #reader {
            width: 100%;
            margin: 20px auto;
        }

        .result {
            background: #e8f5e9;
            padding: 15px;
            border-radius: 10px;
            margin-top: 15px;
            word-break: break-word;
        }

        .form-box {
            display: none;
        }

        label {
            display: block;
            margin-top: 15px;
            margin-bottom: 6px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 13px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 16px;
        }

        button {
            width: 100%;
            margin-top: 20px;
            padding: 13px;
            border: none;
            border-radius: 8px;
            background: #2e7d32;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #256628;
        }

        .back-btn {
            display: block;
            text-align: center;
            margin-top: 15px;
            padding: 13px;
            background: #555;
            color: white;
            text-decoration: none;
            border-radius: 8px;
        }

        .back-btn:hover {
            background: #333;
        }

        .barcode {
            font-weight: bold;
            color: #1565c0;
        }

    </style>

</head>


<body>


<header>

    <h1>📷 ExpiryWise Scanner</h1>

    <p>
        Scan a product barcode
    </p>

</header>


<div class="container">


    <!-- SCANNER -->

    <div class="box">

        <h2>
            📷 Scan Product
        </h2>

        <p>
            Allow camera access and point it at a barcode.
        </p>


        <div id="reader"></div>


        <div
            id="result"
            class="result"
        >
            Waiting for barcode...
        </div>

    </div>



    <!-- PRODUCT FORM -->

    <div
        id="formBox"
        class="box form-box"
    >

        <h2>
            📦 Product Details
        </h2>


        <p>

            Barcode:

            <span
                id="barcodeValue"
                class="barcode"
            >
            </span>

        </p>


        <form
            method="POST"
            action="/scanner/add"
        >


            <input
                type="hidden"
                id="barcodeInput"
                name="barcode"
            >


            <label>
                Product Name
            </label>

            <input
                type="text"
                name="name"
                id="productName"
                placeholder="Example: Milk"
                required
            >


            <label>
                Expiry Date
            </label>

            <input
                type="date"
                name="expiry_date"
                required
            >


            <button type="submit">
                💾 Add Product
            </button>

        </form>

    </div>



    <a
        href="/"
        class="back-btn"
    >
        ← Back to Dashboard
    </a>


</div>



<script src="https://unpkg.com/html5-qrcode"></script>


<script>

    let scanned = false;


    function onScanSuccess(decodedText, decodedResult) {

        if (scanned) {
            return;
        }

        scanned = true;


        document.getElementById("result").innerHTML =
            "✅ Barcode detected!<br><br>" +
            "Barcode: <strong>" +
            decodedText +
            "</strong>";


        document.getElementById("barcodeValue").innerText =
            decodedText;


        document.getElementById("barcodeInput").value =
            decodedText;


        document.getElementById("formBox").style.display =
            "block";


        document.getElementById("productName").focus();


        scanner.clear();

    }


    function onScanFailure(error) {

        // Continue scanning.

    }


    const scanner =
        new Html5QrcodeScanner(
            "reader",
            {
                fps: 10,

                qrbox: {
                    width: 250,
                    height: 250
                }
            },
            false
        );


    scanner.render(
        onScanSuccess,
        onScanFailure
    );

</script>


</body>

</html>
