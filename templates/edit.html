<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Edit Product - ExpiryWise</title>

<style>

body {

    font-family: Arial, sans-serif;

    background: #f4f7f6;

    margin: 0;
}

header {

    background: #2e7d32;

    color: white;

    text-align: center;

    padding: 30px;
}

.container {

    width: 90%;

    max-width: 600px;

    margin: 40px auto;
}

.box {

    background: white;

    padding: 30px;

    border-radius: 15px;

    box-shadow: 0 3px 10px rgba(0,0,0,0.1);
}

input {

    width: 100%;

    padding: 13px;

    margin: 10px 0;

    border: 1px solid #ccc;

    border-radius: 8px;

    font-size: 16px;
}

button {

    width: 100%;

    padding: 13px;

    background: #2e7d32;

    color: white;

    border: none;

    border-radius: 8px;

    font-size: 16px;

    cursor: pointer;
}

.back {

    display: block;

    text-align: center;

    margin-top: 15px;

    text-decoration: none;

    color: #2e7d32;
}

</style>

</head>


<body>


<header>

<h1>✏ Edit Product</h1>

<p>Update your expiry information</p>

</header>


<div class="container">

<div class="box">

<h2>Update Product</h2>


{% if error %}
<div style="background:#fdecea;color:#b71c1c;padding:12px;border-radius:8px;margin-bottom:12px;">
⚠ {{ error }}
</div>
{% endif %}

<form method="POST">


<label>

Product Name

</label>


<input

type="text"

name="name"

value="{{ product['name'] }}"

required

>


<label>

Expiry Date

</label>


<input

type="date"

name="expiry_date"

value="{{ product['expiry_date'] }}"

required

>


<button type="submit">

💾 Save Changes

</button>


</form>


<a class="back" href="/">

← Back to Dashboard

</a>


</div>

</div>


</body>

</html>
